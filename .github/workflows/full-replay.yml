name: Full proof replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y g++ zstd
      - run: python -m pip install -r requirements.txt
      - name: Cold replay
        shell: bash
        run: python verify.py --work replay-ci 2>&1 | tee full-replay.log
      - name: Explorer smoke tests
        run: python explorer/smoke_test.py replay-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-replay-results
          path: |
            full-replay.log
            replay-ci/summary.tsv
            replay-ci/VERIFIED.json
            replay-ci/*.missing.tsv
